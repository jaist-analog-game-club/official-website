name: Update member count

on:
  schedule:
    - cron: "0 15 * * *"   # 毎日 0:00 JST (UTC+9) に自動実行
  workflow_dispatch:        # GitHub上から手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update member count from Google Sheets
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
          SHEET_RANGE: "Sheet1!A:A"   # ← 名前が入っている列に合わせて変更
        run: python update_members.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: update member count"
          git push
